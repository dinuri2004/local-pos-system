spring.application.name=pos-backend
server.port=9090

# H2 File-Based Embedded Database (Portable)
spring.datasource.url=jdbc:h2:file:./homeware_pos_data;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Enable H2 web console for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console